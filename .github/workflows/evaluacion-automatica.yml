name: Evaluación automática

# Cierra las convocatorias vencidas y evalúa a sus postores pendientes (ver automatizacion.py).
on:
  schedule:
    - cron: "0 * * * *"  # cada hora; GitHub puede demorar unos minutos en iniciarla
  workflow_dispatch:      # también se puede ejecutar a mano desde la pestaña Actions

concurrency:
  group: evaluacion-automatica
  cancel-in-progress: false  # nunca se cortan dos ejecuciones entre sí

jobs:
  evaluar:
    runs-on: ubuntu-24.04  # fijo: ubuntu-latest pasa a Ubuntu 26 desde el 19/10/2026
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python automatizacion.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-3.5-flash-lite' }}
          LIMITE_DIARIO_CONSULTAS: ${{ vars.LIMITE_DIARIO_CONSULTAS || '400' }}
